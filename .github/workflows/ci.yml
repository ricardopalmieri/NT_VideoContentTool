name: Validar fonte e paridade
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
      - run: npm run package:hostinger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-paridade
          path: |
            playwright-report/
            test-results/
          retention-days: 14
